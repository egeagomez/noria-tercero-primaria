  <script>window.NORIA_CONFIG = {"page":"mission","mission":{"id":"LCL-T1-S04","week":4,"title":"Un final para Sira","goal":"Crear un desenlace coherente con los personajes y el problema del cuento.","intro":"Hay un problema nuevo en la noria y tú puedes escribir más de un final posible.","guide":"sira","story":"Sira había preparado un pequeño teatro de sombras para el club de cuentos. Colocó una pantalla blanca en el taller y dejó las figuras de cartón sobre una bandeja. Nori probó la lámpara mientras Plumi repartía las sillas. Cuando Lumo llegó con el cuento, una ráfaga entró por la puerta y mezcló todas las figuras. La figura del protagonista perdió su palito y quedó detrás de una caja. Faltaban pocos minutos para empezar. Sira respiró despacio, miró los materiales de la mesa y pidió al equipo que pensara una solución. Allí había cinta de papel, lápices y un palito de repuesto.","criteria":["8.2"],"tasks":[{"type":"choice","prompt":"¿Qué problema debe tener en cuenta cualquier final?","options":["La pantalla es negra.","La figura protagonista ha perdido el palito.","El taller se ha inundado."],"answer":1,"hint":"Busca qué ocurre después de la ráfaga.","explanation":"El texto señala que el protagonista pierde su palito: un final coherente debe atender a ese problema."},{"type":"match","prompt":"Une cada detalle con su papel en el relato.","pairs":[["Sira","Prepara el teatro"],["Ráfaga","Desordena las figuras"],["Palito de repuesto","Material que puede ayudar"]],"hint":"Distingue personajes, causa del problema y recursos disponibles.","explanation":"Cada detalle permite preparar un desenlace conectado con el inicio."},{"type":"choice","prompt":"¿Qué afirmación respeta los datos del comienzo?","options":["Nori no está en el taller.","No queda ningún material.","El equipo dispone de cinta y un palito."],"answer":2,"hint":"Relee la última frase.","explanation":"El cuento ofrece cinta, lápices y un palito de repuesto; se pueden usar al inventar un final."},{"type":"order","prompt":"Ordena este modelo de solución; después podrás crear otro.","items":["Plumi encuentra la figura detrás de la caja.","Nori coloca el palito de repuesto.","Sira comprueba que la figura se mueve.","El equipo inicia el teatro."],"hint":"En este modelo, primero encuentran la figura y después la reparan y prueban.","explanation":"Esta es una solución posible; el cuento también admite otros desenlaces coherentes."},{"type":"choice","prompt":"¿Qué frase conecta una acción con su consecuencia?","options":["Nori sujetó el palito y la figura volvió a moverse.","La palabra noria tiene cinco letras.","Mañana hay otra estación."],"answer":0,"hint":"Busca dos acciones relacionadas con la reparación.","explanation":"Sujetar el palito permite mover la figura: la frase expresa una relación útil para el desenlace."},{"type":"choice","prompt":"¿Qué sabemos del final antes de escribirlo?","options":["Solo puede ser feliz.","Puede tener soluciones distintas si respeta el inicio.","Debe copiar exactamente el modelo."],"answer":1,"hint":"Piensa en la diferencia entre una pista y un final obligatorio.","explanation":"La creación literaria admite distintos finales; aquí practicamos cómo mantener la coherencia."}],"project":{"title":"Dos caminos y tu final","prompt":"Lee estos caminos: A) reparar la figura y probarla; B) convertir a Lumo en narrador mientras buscan la figura. Elige uno o inventa otro y escribe tres o cuatro frases.","model":"Nori encontró el palito de repuesto. Sira lo sujetó a la figura con cinta y probó sus movimientos. El personaje volvió a bailar sobre la pantalla. El equipo comenzó el cuento y dejó la puerta cerrada.","checklist":["Mi final responde al problema del comienzo.","Las acciones se entienden y están ordenadas.","Releo y mejoro una frase."],"extension":"Escribe un segundo final con otra solución y explica qué cambia en la historia.","teacherNotes":"Valorar coherencia y revisión de la creación; no imponer el modelo ni premiar un tipo de final por s

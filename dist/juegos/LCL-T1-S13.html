  <script>window.NORIA_CONFIG = {"page":"mission","mission":{"id":"LCL-T1-S13","week":13,"title":"Una entrevista para informar","goal":"Planificar preguntas pertinentes para obtener datos de un hecho del aula.","intro":"Sira prepara un guion y unas notas que usaremos después para una noticia breve.","guide":"sira","story":"Entrevista ficticia de práctica. Nori explica un proyecto del equipo: «El lunes 30 de noviembre construimos un organizador de cartón en el taller. Participamos Sira, Plumi, Lumo y yo. Tiene tres compartimentos para separar tarjetas de cuentos». Notas comprobadas: día, lunes 30 de noviembre; lugar, taller; participantes, los cuatro personajes; objeto, organizador de cartón; finalidad, separar tarjetas. No consta que hayan ganado un premio ni que todos los materiales del taller quepan en él.","criteria":["5.1"],"tasks":[{"type":"choice","prompt":"Para saber la finalidad del organizador, ¿qué pregunta es pertinente?","options":["¿Cuál es tu comida favorita?","¿Para qué sirve el organizador?","¿Te gusta más el verano?"],"answer":1,"hint":"Busca una pregunta relacionada con el uso del objeto.","explanation":"«¿Para qué sirve?» permite obtener información sobre su finalidad."},{"type":"match","prompt":"Relaciona cada pregunta con el dato que busca.","pairs":[["¿Cuándo lo construisteis?","Lunes 30 de noviembre"],["¿Dónde trabajasteis?","En el taller"],["¿Quiénes participaron?","Los cuatro personajes"]],"hint":"Cada pregunta pide un tipo de información distinto.","explanation":"Cuándo, dónde y quién ayudan a organizar datos necesarios para informar."},{"type":"choice","prompt":"¿Qué pregunta evita dar por hecho algo que no aparece en las notas?","options":["¿Qué premio ganasteis?","¿Por qué lo fabricaste tú solo?","¿Qué materiales utilizasteis?"],"answer":2,"hint":"Comprueba qué suposiciones contienen las preguntas.","explanation":"Preguntar por los materiales no presupone un premio ni un trabajo individual; las notas hablan de un equipo y cartón."},{"typ s; si se entrevista realmente, supervisar la actividad y sustituir los datos ficticios solo por información verificada."},"start":"2026-11-30","end":"2026-12-04","language":"es","contentVersion":1},"subject":"lengua","subjectTitle":"Lengua","home":"../index.html","download":"../descargas/LCL-T1-S13.html","standalone":false};</script>

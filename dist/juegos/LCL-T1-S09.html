  <script>window.NORIA_CONFIG = {"page":"mission","mission":{"id":"LCL-T1-S09","week":9,"title":"Instrucciones para abrir la noria","goal":"Reconocer pasos, orden y verbos de acción en instrucciones sencillas.","intro":"Abriremos una caja de cuentos con una noria de cartón: es un juego de mesa, no una máquina real.","guide":"nori","story":"Para abrir nuestra noria de cartón, prepara tres tarjetas: una semilla, una hoja y una flor. Coloca primero la semilla en la casilla de salida. Después, sitúa la hoja en la casilla central. Por último, pon la flor junto al dibujo de la caja. Comprueba que los dibujos siguen ese orden y levanta la solapa de papel marcada con una estrella. Debajo encontrarás una palabra del cuento. No hace falta girar piezas ni tocar mecanismos: solo usamos tarjetas, una base de cartón y una solapa ya preparada por el docente.","criteria":["4.1"],"tasks":[{"type":"order","prompt":"Ordena la colocación de las tarjetas según las instrucciones.","items":["Coloca la semilla en la salida.","Sitúa la hoja en la casilla central.","Pon la flor junto a la caja."],"hint":"Busca las palabras «primero», «después» y «por último».","explanation":"El texto pide colocar semilla, hoja y flor en ese orden."},{"type":"match","prompt":"Une cada tarjeta con su posición.","pairs":[["Semilla","Casilla de salida"],["Hoja","Casilla central"],["Flor","Junto al dibujo de la caja"]],"hint":"Cada instrucción nombra una tarjeta y un lugar.","explanation":"Relacionar objeto y posición permite ejecutar la consigna sin adivinar."},{"type":"choice","prompt":"Si el equipo coloca la semilla y después la flor, ¿qué paso se ha saltado?","options":["Colocar una piedra.","Girar un mecanismo.","Situar la hoja en la casilla central."],"answer":2,"hint":"Compara su secuencia con el segundo paso del texto.","explanation":"Falta la hoja, que debe ir entre la semilla y la flor."},{"type":"choice","prompt":"¿Qué palabra indica una acción en «levanta la solapa»?","options":["Solapa","Levanta","La"],"answer":1,"hint":"Busca lo que se pide hacer.","explanation":"«Levanta» expresa la acción; «solapa» nombra el objeto sobre el que actuamos."},{"type":"order","prompt":"Ordena las últimas acciones del juego.","items":["Comprueba el orden de las tres tarjetas.","Levanta la solapa con estrella.","Lee la palabra que estaba debajo."],"hint":"Primero se revisa; solo después se descubre lo que cubría la solapa.","explanation":"Es necesario levantar la solapa para ver la palabra; antes se comprueba la secuencia."},{"type":"choice","prompt":"¿Qué hace falta para este juego según el texto?","options":["Tarjetas, cartón y una solapa preparada.","Un motor y un enchufe.","Herramientas para desmontar una noria."],"answer":0,"hint":"Lee la última frase: se trata de un juego de mesa.","explanation":"El texto aclara que usamos materiales de papel y cartón y que no se manipulan mecanismos."}],"project":{"title":"El paso que faltaba","prompt":"Representa las instrucciones con tres tarjetas, retira el paso central y explica a una pareja qué falta y por qué cambia la secuencia.","model":"Falta «Sitúa la hoja en la casilla central». Sin ese paso, la semilla y la flor ya no tienen la hoja entre ellas.","checklist":["Recupero el paso que falta.","Lo sitúo en el lugar indicado.","Explico la omisión con una pista del texto."],"extension":"Introduce un error de posición distinto y escribe una instrucción que permita corregirlo.","teacherNotes":"Observar comprensión del texto y explicación de la omisión; las adaptaciones motrices al colocar tarjetas no rebajan el logro lector."},"start":"2026-11-02","end":"2026-11-06","language":"es","contentVersion":1},"subject":"lengua","subjectTitle":"Lengua","home":"../index.html","download":"../descargas/LCL-T1-S09.html","standalone":false};</script>
